# Quote of the day — one per day, in a shuffled but fixed order. Add as many as you like.
# `original` is optional: the quote in its own language, shown above the translation.

[[quote]]
text = "There is no duty we so much underrate as the duty of being happy."
author = "Robert Louis Stevenson"
source = "An Apology for Idlers"

[[quote]]
text = "I travel not to go anywhere, but to go. I travel for travel’s sake. The great affair is to move."
author = "Robert Louis Stevenson"
source = "Travels with a Donkey in the Cévennes"

[[quote]]
text = "O wad some Pow’r the giftie gie us / To see oursels as ithers see us!"
author = "Robert Burns"
source = "To a Louse"

[[quote]]
text = "Breathes there the man with soul so dead, / Who never to himself hath said, / This is my own, my native land!"
author = "Walter Scott"
source = "The Lay of the Last Minstrel"

[[quote]]
text = "You see, but you do not observe."
author = "Arthur Conan Doyle"
source = "A Scandal in Bohemia"

[[quote]]
text = "It is a capital mistake to theorize before one has data."
author = "Arthur Conan Doyle"
source = "A Scandal in Bohemia"

[[quote]]
text = "There is nothing more deceptive than an obvious fact."
author = "Arthur Conan Doyle"
source = "The Boscombe Valley Mystery"

[[quote]]
text = "Beauty is no quality in things themselves: it exists merely in the mind which contemplates them."
author = "David Hume"
source = "Of the Standard of Taste"

[[quote]]
text = "Often the mountain gives itself most completely when I have no destination."
author = "Nan Shepherd"
source = "The Living Mountain"

[[quote]]
original = "Жақсы сөз — жарым ырыс."
text = "A kind word is half of happiness."
author = "Kazakh proverb"

[[quote]]
original = "Білім — инемен құдық қазғандай."
text = "Gaining knowledge is like digging a well with a needle."
author = "Kazakh proverb"

[[quote]]
original = "Жеті рет өлшеп, бір рет кес."
text = "Measure seven times, cut once."
author = "Kazakh proverb"

[[quote]]
original = "Отан — оттан да ыстық."
text = "Your homeland is warmer than fire."
author = "Kazakh proverb"

[[quote]]
original = "Туған жер — алтын бесік."
text = "The land where you were born is a golden cradle."
author = "Kazakh proverb"

[[quote]]
original = "Сабыр түбі — сары алтын."
text = "At the bottom of patience lies gold."
author = "Kazakh proverb"

[[quote]]
original = "Ақыл — азбайтын тон, білім — таусылмайтын кен."
text = "Wisdom is a coat that never wears out; knowledge is a mine that never runs dry."
author = "Kazakh proverb"

[[quote]]
original = "Бірлік бар жерде — тірлік бар."
text = "Where there is unity, there is life."
author = "Kazakh proverb"

[[quote]]
original = "Өнер алды — қызыл тіл."
text = "The first of all the arts is the gift of words."
author = "Kazakh proverb"

[[quote]]
original = "Ғылым таппай мақтанба."
text = "Don’t boast before you have gained knowledge."
author = "Abai Kunanbayev"

[[quote]]
text = "Not all those who wander are lost."
author = "J. R. R. Tolkien"
source = "The Fellowship of the Ring"

[[quote]]
text = "All we have to decide is what to do with the time that is given us."
author = "J. R. R. Tolkien"
source = "The Fellowship of the Ring"

[[quote]]
text = "In the midst of winter, I found there was, within me, an invincible summer."
author = "Albert Camus"
source = "Return to Tipasa"

[[quote]]
text = "Isn’t it nice to think that tomorrow is a new day with no mistakes in it yet?"
author = "L. M. Montgomery"
source = "Anne of Green Gables"

[[quote]]
text = "Tell me, what is it you plan to do / with your one wild and precious life?"
author = "Mary Oliver"
source = "The Summer Day"

[[quote]]
text = "Let everything happen to you: beauty and terror. Just keep going. No feeling is final."
author = "Rainer Maria Rilke"
source = "Book of Hours"

[[quote]]
text = "How wonderful it is that nobody need wait a single moment before starting to improve the world."
author = "Anne Frank"

[[quote]]
text = "It is only with the heart that one can see rightly; what is essential is invisible to the eye."
author = "Antoine de Saint-Exupéry"
source = "The Little Prince"

[[quote]]
text = "A journey of a thousand miles begins with a single step."
author = "Lao Tzu"
source = "Tao Te Ching"

[[quote]]
text = "While we are postponing, life speeds by."
author = "Seneca"
source = "Letters to Lucilius"

[[quote]]
text = "There is no charm equal to tenderness of heart."
author = "Jane Austen"
source = "Emma"

[[quote]]
text = "I am no bird; and no net ensnares me: I am a free human being with an independent will."
author = "Charlotte Brontë"
source = "Jane Eyre"

[[quote]]
text = "The best way out is always through."
author = "Robert Frost"
source = "A Servant to Servants"

[[quote]]
text = "Hope is the thing with feathers / That perches in the soul."
author = "Emily Dickinson"

[[quote]]
text = "We are all in the gutter, but some of us are looking at the stars."
author = "Oscar Wilde"
source = "Lady Windermere’s Fan"

[[quote]]
text = "Be not afraid of growing slowly; be afraid only of standing still."
author = "Chinese proverb"
