name: Daily paper

on:
  schedule:
    - cron: "40 5 * * *"     # KK's paper: 05:40 UTC = 05:40 in Edinburgh in winter, 06:40 in summer
    - cron: "30 1 * * *"     # «Утро»: 01:30 UTC = 06:30 in Astana
  workflow_dispatch:          # "Run workflow" button for an extra edition
    inputs:
      paper:
        description: "Which paper"
        type: choice
        options: [kk, my]
        default: kk
      notify:
        description: "Send it to Telegram"
        type: boolean
        default: true

permissions:
  contents: write             # save the edition to the archive
  pages: write
  id-token: write

concurrency:
  group: daily-paper          # one paper at a time: both deploy the same website
  cancel-in-progress: false

env:
  PAPER: ${{ github.event.schedule == '30 1 * * *' && 'my' || inputs.paper || 'kk' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build today's edition       # web pages + print PDFs (Chrome comes with the runner)
        run: python build.py papers/$PAPER.toml

      # Committing the edition keeps the archive (and the translation cache) and keeps GitHub
      # from pausing the schedule (it does that to repos with no activity for 60 days).
      - name: Save to archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git commit -m "Edition $(date -u +%F) ($PAPER)" || echo "Nothing new to save"
          git pull --rebase -q && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send to Telegram
        if: github.event_name == 'schedule' || inputs.notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # each paper has its own readers; «Утро» never falls back to KK's list
          TELEGRAM_CHAT_ID: ${{ env.PAPER == 'my' && secrets.TELEGRAM_CHAT_ID_MY || env.PAPER != 'my' && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python notify.py --summary build/$PAPER/summary.json
