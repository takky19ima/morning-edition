name: Daily paper

on:
  # GitHub sometimes skips a scheduled run, so each paper has backup times;
  # done.py makes sure only the first run of the day does anything.
  schedule:
    - cron: "40 5 * * *"     # KK's paper: 05:40 UTC = 05:40 in Edinburgh in winter, 06:40 in summer
    - cron: "20 6 * * *"     # … backup
    - cron: "10 7 * * *"     # … backup
    - cron: "30 1 * * *"     # «Утро»: 01:30 UTC = 06:30 in Astana — built for /my, not sent
    - cron: "10 2 * * *"     # … backup
  workflow_dispatch:          # "Run workflow" button for an extra edition
    inputs:
      paper:
        description: "Which paper"
        type: choice
        options: [kk, my]
        default: kk
      notify:
        description: "Send it to Telegram"
        type: boolean
        default: true
      alarm:
        description: "Started by the alarm clock (bot/api/alarm.js): behave like the schedule"
        type: boolean
        default: false

permissions:
  contents: write             # save the edition to the archive
  pages: write
  id-token: write

concurrency:
  group: daily-paper          # one paper at a time: both deploy the same website
  cancel-in-progress: false

env:
  PAPER: ${{ (github.event.schedule == '30 1 * * *' || github.event.schedule == '10 2 * * *') && 'my' || inputs.paper || 'kk' }}
  # the schedule and the alarm clock both start the daily edition; whichever comes first does the work
  SCHEDULED: ${{ github.event_name == 'schedule' || format('{0}', inputs.alarm) == 'true' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.done.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # the latest marks, even if this run waited for another one to finish
      - id: done
        run: python3 done.py check $PAPER >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # The local translation model (~1.4 GB) is downloaded once and kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-200-distilled-1.3B-ct2-int8

      - name: Build today's edition       # web pages + print PDFs (Chrome comes with the runner)
        run: python build.py papers/$PAPER.toml
        env:
          PYTHONUNBUFFERED: "1"           # show progress live, even if something crashes

      # Committing the edition keeps the archive (and the translation cache) and keeps GitHub
      # from pausing the schedule (it does that to repos with no activity for 60 days).
      - name: Save to archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git commit -m "Edition $(date -u +%F) ($PAPER)" || echo "Nothing new to save"
          git pull --rebase -q && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

      # KK's paper arrives by itself; «Утро» only when asked for with /my (or a manual run).
      - name: Send to Telegram
        if: (env.SCHEDULED == 'true' && env.PAPER != 'my') || (env.SCHEDULED != 'true' && github.event_name == 'workflow_dispatch' && inputs.notify)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # each paper has its own readers; «Утро» never falls back to KK's list
          TELEGRAM_CHAT_ID: ${{ env.PAPER == 'my' && secrets.TELEGRAM_CHAT_ID_MY || env.PAPER != 'my' && secrets.TELEGRAM_CHAT_ID || '' }}
          # signs each reader's one-time link to her journal (the bot has the same secret)
          JOURNAL_LINK_SECRET: ${{ secrets.JOURNAL_LINK_SECRET }}
        run: python notify.py --summary build/$PAPER/summary.json

      - name: Mark today's edition as done
        if: env.SCHEDULED == 'true' || inputs.notify || env.PAPER == 'my'
        run: |
          python done.py mark $PAPER
          git add cache
          git commit -m "Done: $PAPER $(date -u +%F)" || exit 0
          git pull --rebase -q && git push
